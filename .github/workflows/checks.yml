name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tests/test_gym.py holds pytest-style functions (no TestCase subclasses),
      # so `unittest discover` collected nothing and exited 5 -- a red gate that
      # never ran an assertion.
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
